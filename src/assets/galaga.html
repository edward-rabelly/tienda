<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>GALAGAR</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      color: #fff;
      font-family: 'Courier New', monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #menu, #game {
      text-align: center;
    }
    #game { display: none; }
    h1 {
      font-size: 80px;
      color: #ff0055;
      text-shadow: 0 0 20px #ff0055, 0 0 40px #ff0055;
      letter-spacing: 10px;
      margin-bottom: 20px;
      animation: flicker 2s infinite alternate;
    }
    @keyframes flicker {
      from { text-shadow: 0 0 20px #ff0055, 0 0 40px #ff0055; }
      to   { text-shadow: 0 0 30px #ff00aa, 0 0 60px #ff00aa; }
    }
    .subtitle {
      color: #00ffff;
      font-size: 18px;
      margin-bottom: 40px;
      letter-spacing: 3px;
    }
    #playBtn {
      background: transparent;
      color: #ffff00;
      border: 3px solid #ffff00;
      padding: 18px 50px;
      font-size: 24px;
      font-family: 'Courier New', monospace;
      cursor: pointer;
      letter-spacing: 4px;
      transition: all 0.3s;
      text-shadow: 0 0 10px #ffff00;
      box-shadow: 0 0 20px #ffff00;
    }
    #playBtn:hover {
      background: #ffff00;
      color: #000;
      box-shadow: 0 0 40px #ffff00;
    }
    canvas {
      border: 2px solid #00ffff;
      box-shadow: 0 0 30px #00ffff;
      background: #000;
    }
    #hud {
      color: #fff;
      font-size: 20px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      width: 600px;
      letter-spacing: 2px;
    }
    .score { color: #ffff00; }
    .lives { color: #00ff88; }
    .controls {
      color: #888;
      margin-top: 15px;
      font-size: 14px;
    }
  </style>
</head>
<body>

<div id="menu">
  <h1>GALAGAR</h1>
  <p class="subtitle">★ DEFENDER LA GALAXIA ★</p>
  <button id="playBtn">PRESIONE AQUÍ JUGAR</button>
  <p class="controls" style="margin-top:30px;">← → mover  |  ESPACIO disparar</p>
</div>

<div id="game">
  <div id="hud">
    <span class="score">SCORE: <span id="score">0</span></span>
    <span class="lives">VIDAS: <span id="lives">3</span></span>
  </div>
  <canvas id="canvas" width="600" height="600"></canvas>
  <p class="controls">← → mover  |  ESPACIO disparar  |  R reiniciar</p>
</div>

<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  let score = 0, lives = 3, gameOver = false;
  const keys = {};

  // Estrellas de fondo
  const stars = Array.from({length: 80}, () => ({
    x: Math.random()*W, y: Math.random()*H,
    s: Math.random()*2+0.5, v: Math.random()*1.5+0.5
  }));

  // Nave del jugador
  const player = {
    x: W/2 - 20, y: H - 60, w: 40, h: 30, speed: 6, cooldown: 0
  };

  let bullets = [];
  let enemyBullets = [];
  let enemies = [];
  let explosions = [];

  function spawnEnemies() {
    enemies = [];
    const rows = 4, cols = 8;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        enemies.push({
          x: 60 + c*60, y: 60 + r*45,
          w: 30, h: 25,
          type: r === 0 ? 2 : (r < 2 ? 1 : 0),
          alive: true,
          baseX: 60 + c*60,
          phase: Math.random()*Math.PI*2
        });
      }
    }
  }

  function drawPlayer() {
    ctx.fillStyle = '#00ffff';
    ctx.shadowColor = '#00ffff';
    ctx.shadowBlur = 15;
    // Cuerpo
    ctx.beginPath();
    ctx.moveTo(player.x + player.w/2, player.y);
    ctx.lineTo(player.x, player.y + player.h);
    ctx.lineTo(player.x + player.w, player.y + player.h);
    ctx.closePath();
    ctx.fill();
    // Alas
    ctx.fillStyle = '#ff00ff';
    ctx.fillRect(player.x - 5, player.y + player.h - 10, 8, 10);
    ctx.fillRect(player.x + player.w - 3, player.y + player.h - 10, 8, 10);
    ctx.shadowBlur = 0;
  }

  function drawEnemy(e) {
    const colors = ['#ff0055', '#ffaa00', '#ff00ff'];
    ctx.fillStyle = colors[e.type];
    ctx.shadowColor = colors[e.type];
    ctx.shadowBlur = 10;
    // Cuerpo tipo insecto alien
    ctx.beginPath();
    ctx.arc(e.x + e.w/2, e.y + e.h/2, e.w/2, 0, Math.PI*2);
    ctx.fill();
    // Ojos
    ctx.fillStyle = '#fff';
    ctx.fillRect(e.x + 6, e.y + 8, 5, 5);
    ctx.fillRect(e.x + e.w - 11, e.y + 8, 5, 5);
    // Antenas
    ctx.strokeStyle = colors[e.type];
    ctx.beginPath();
    ctx.moveTo(e.x + 5, e.y + 3);
    ctx.lineTo(e.x - 2, e.y - 5);
    ctx.moveTo(e.x + e.w - 5, e.y + 3);
    ctx.lineTo(e.x + e.w + 2, e.y - 5);
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  function drawBullet(b, color) {
    ctx.fillStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = 10;
    ctx.fillRect(b.x - 2, b.y, 4, 12);
    ctx.shadowBlur = 0;
  }

  function drawExplosion(ex) {
    ctx.fillStyle = `rgba(255,${200-ex.life*10},0,${ex.life/30})`;
    ctx.shadowColor = '#ffaa00';
    ctx.shadowBlur = 20;
    for (let i = 0; i < 8; i++) {
      const a = (i/8) * Math.PI*2;
      const r = (30 - ex.life) * 1.5;
      ctx.beginPath();
      ctx.arc(ex.x + Math.cos(a)*r, ex.y + Math.sin(a)*r, 3, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.shadowBlur = 0;
  }

  function drawStars() {
    ctx.fillStyle = '#fff';
    stars.forEach(s => {
      ctx.globalAlpha = s.s/2.5;
      ctx.fillRect(s.x, s.y, s.s, s.s);
      s.y += s.v;
      if (s.y > H) { s.y = 0; s.x = Math.random()*W; }
    });
    ctx.globalAlpha = 1;
  }

  let enemyDir = 1, enemySpeed = 0.5, enemyDropTimer = 0;

  function update() {
    // Estrellas
    // Movimiento del jugador
    if (keys['ArrowLeft'] && player.x > 0) player.x -= player.speed;
    if (keys['ArrowRight'] && player.x < W - player.w) player.x += player.speed;
    if (keys[' '] && player.cooldown <= 0) {
      bullets.push({x: player.x + player.w/2, y: player.y});
      player.cooldown = 15;
    }
    if (player.cooldown > 0) player.cooldown--;

    // Balas jugador
    bullets = bullets.filter(b => {
      b.y -= 8;
      return b.y > 0;
    });

    // Balas enemigos
    enemyBullets = enemyBullets.filter(b => {
      b.y += 4;
      return b.y < H;
    });

    // Movimiento enemigos (formación)
    let minX = W, maxX = 0;
    enemies.filter(e => e.alive).forEach(e => {
      e.x += enemyDir * enemySpeed;
      if (e.x < minX) minX = e.x;
      if (e.x + e.w > maxX) maxX = e.x + e.w;
    });
    if (maxX > W - 20 || minX < 20) {
      enemyDir *= -1;
      enemies.filter(e => e.alive).forEach(e => e.y += 15);
    }

    // Enemigos disparan
    enemyDropTimer++;
    if (enemyDropTimer > 60) {
      enemyDropTimer = 0;
      const alive = enemies.filter(e => e.alive);
      if (alive.length > 0) {
        const shooter = alive[Math.floor(Math.random()*alive.length)];
        enemyBullets.push({x: shooter.x + shooter.w/2, y: shooter.y + shooter.h});
      }
    }

    // Colisiones balas vs enemigos
    bullets.forEach(b => {
      enemies.forEach(e => {
        if (e.alive && b.x > e.x && b.x < e.x+e.w && b.y > e.y && b.y < e.y+e.h) {
          e.alive = false;
          b.y = -100;
          score += (e.type+1) * 100;
          explosions.push({x: e.x+e.w/2, y: e.y+e.h/2, life: 30});
          document.getElementById('score').textContent = score;
        }
      });
    });

    // Colisiones balas enemigos vs jugador
    enemyBullets.forEach(b => {
      if (b.x > player.x && b.x < player.x+player.w &&
          b.y > player.y && b.y < player.y+player.h) {
        b.y = H + 100;
        lives--;
        document.getElementById('lives').textContent = lives;
        explosions.push({x: player.x+player.w/2, y: player.y+player.h/2, life: 30});
        if (lives <= 0) gameOver = true;
        else { player.x = W/2 - 20; }
      }
    });

    // Enemigos llegan abajo
    enemies.filter(e => e.alive).forEach(e => {
      if (e.y + e.h > player.y) gameOver = true;
    });

    // Explosiones
    explosions = explosions.filter(ex => {
      ex.life--;
      return ex.life > 0;
    });

    // Victoria
    if (enemies.every(e => !e.alive)) {
      enemySpeed += 0.3;
      spawnEnemies();
    }
  }

  function draw() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    drawStars();

    enemies.filter(e => e.alive).forEach(drawEnemy);
    drawPlayer();
    bullets.forEach(b => drawBullet(b, '#ffff00'));
    enemyBullets.forEach(b => drawBullet(b, '#ff0055'));
    explosions.forEach(drawExplosion);

    if (gameOver) {
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#ff0055';
      ctx.font = '60px Courier New';
      ctx.textAlign = 'center';
      ctx.shadowColor = '#ff0055';
      ctx.shadowBlur = 20;
      ctx.fillText('GAME OVER', W/2, H/2 - 20);
      ctx.fillStyle = '#ffff00';
      ctx.font = '24px Courier New';
      ctx.fillText('SCORE: ' + score, W/2, H/2 + 20);
      ctx.fillStyle = '#00ffff';
      ctx.fillText('Presiona R para reiniciar', W/2, H/2 + 60);
      ctx.shadowBlur = 0;
    }
  }

  function loop() {
    if (!gameOver) update();
    draw();
    requestAnimationFrame(loop);
  }

  function startGame() {
    score = 0; lives = 3; gameOver = false;
    enemySpeed = 0.5; enemyDir = 1;
    bullets = []; enemyBullets = []; explosions = [];
    player.x = W/2 - 20;
    document.getElementById('score').textContent = 0;
    document.getElementById('lives').textContent = 3;
    spawnEnemies();
  }

  // Controles
  document.addEventListener('keydown', e => {
    keys[e.key] = true;
    if (e.key === 'r' || e.key === 'R') {
      if (gameOver) startGame();
    }
  });
  document.addEventListener('keyup', e => keys[e.key] = false);

  // Botón jugar
  document.getElementById('playBtn').addEventListener('click', () => {
    document.getElementById('menu').style.display = 'none';
    document.getElementById('game').style.display = 'block';
    startGame();
    loop();
  });
</script>
</body>
</html>
