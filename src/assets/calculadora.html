<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    body { margin: 0; padding: 20px; background: #2c3e50; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .calc-container { background: #34495e; padding: 20px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    #display { width: 100%; height: 60px; font-size: 28px; text-align: right; padding: 10px; margin-bottom: 15px; border: none; border-radius: 8px; background: #ecf0f1; color: #2c3e50; box-sizing: border-box; }
    .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    button { padding: 20px; font-size: 20px; border: none; border-radius: 8px; cursor: pointer; background: #95a5a6; color: white; transition: 0.2s; }
    button:hover { background: #7f8c8d; }
    .operator { background: #e67e22; }
    .operator:hover { background: #d35400; }
    .equal { background: #27ae60; grid-column: span 2; }
    .equal:hover { background: #2ecc71; }
    .clear { background: #c0392b; }
    .clear:hover { background: #e74c3c; }
  </style>
</head>
<body>
<div class="calc-container">
  <input type="text" id="display" readonly>
  <div class="buttons">
    <button class="clear" onclick="clearDisplay()">C</button>
    <button onclick="appendValue('(')">(</button>
    <button onclick="appendValue(')')">)</button>
    <button class="operator" onclick="appendValue('/')">/</button>

    <button onclick="appendValue('7')">7</button>
    <button onclick="appendValue('8')">8</button>
    <button onclick="appendValue('9')">9</button>
    <button class="operator" onclick="appendValue('*')">*</button>

    <button onclick="appendValue('4')">4</button>
    <button onclick="appendValue('5')">5</button>
    <button onclick="appendValue('6')">6</button>
    <button class="operator" onclick="appendValue('-')">-</button>

    <button onclick="appendValue('1')">1</button>
    <button onclick="appendValue('2')">2</button>
    <button onclick="appendValue('3')">3</button>
    <button class="operator" onclick="appendValue('+')">+</button>

    <button onclick="appendValue('0')">0</button>
    <button onclick="appendValue('.')">.</button>
    <button class="equal" onclick="calculate()">=</button>
  </div>
</div>
<script>
  function appendValue(val) { document.getElementById('display').value += val; }
  function clearDisplay() { document.getElementById('display').value = ''; }
  function calculate() {
    try { document.getElementById('display').value = eval(document.getElementById('display').value); }
    catch { document.getElementById('display').value = 'Error'; }
  }
</script>
</body>
</html>
