<!-- PRUEBA: Si ves este cuadro rojo, el archivo está cargando -->
<div style="position: fixed; top: 0; left: 0; background: red; color: white; padding: 20px; z-index: 999999; font-weight: bold; border: 3px solid yellow;">
  ✅ PRODUCTOS.HTML ESTÁ CARGANDO CORRECTAMENTE
</div>

<!-- BOTONES DE PRUEBA EN ESQUINA SUPERIOR DERECHA -->
<div style="position: fixed; top: 10px; right: 10px; background: yellow; padding: 10px; z-index: 999999; border: 2px solid red;">
  <button (click)="openModal('calculadora')" style="font-size: 30px; margin-right: 10px; cursor: pointer;">🧮</button>
  <button (click)="openModal('juego')" style="font-size: 30px; cursor: pointer;">🚀</button>
</div>

<!-- CONTENIDO DE LA TIENDA -->
<div class="tienda">
  <header class="encabezado">
    <h1>🛒 Tienda Tech</h1>
    <p>¡Encuentra lo que necesitas y compra tus productos favoritos!</p>
  </header>

  <main>
    <h2>Productos disponibles</h2>

    <div *ngFor="let producto of productos" class="producto">
      <h3>{{ producto.nombre }}</h3>
      <p>{{ producto.descripcion }}</p>
      <p><strong>Precio:</strong> ${{ producto.precio }}</p>
      <p><strong>Stock:</strong> {{ producto.stock }}</p>
      <p><strong>Categoría:</strong> {{ producto.categoria }}</p>
      <button (click)="comprar(producto)">Comprar</button>
    </div>
  </main>
</div>

<!-- BOTONES FLOTANTES EN ESQUINA INFERIOR DERECHA -->
<div style="position: fixed; bottom: 30px; right: 30px; display: flex; flex-direction: column; gap: 15px; z-index: 999998;">
  <button (click)="openModal('calculadora')"
          style="width: 70px; height: 70px; border-radius: 50%; background: blue; color: white; font-size: 35px; border: 3px solid white; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5);">
    🧮
  </button>
  <button (click)="openModal('juego')"
          style="width: 70px; height: 70px; border-radius: 50%; background: red; color: white; font-size: 35px; border: 3px solid white; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5);">
    🚀
  </button>
</div>

<!-- MODAL -->
<div *ngIf="modalAbierto"
     style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.9); z-index: 1000000; display: flex; justify-content: center; align-items: center;"
     (click)="cerrarModal()">

  <div style="background: white; padding: 20px; border-radius: 10px; position: relative; max-width: 90vw; max-height: 90vh;"
       (click)="$event.stopPropagation()">

    <button (click)="cerrarModal()"
            style="position: absolute; top: -15px; right: -15px; background: red; color: white; border: none; border-radius: 50%; width: 40px; height: 40px; font-size: 20px; cursor: pointer; font-weight: bold;">
      X
    </button>

    <iframe *ngIf="tipoModal === 'calculadora'"
            src="assets/calculadora.html"
            style="width: 340px; height: 480px; border: none;">
    </iframe>

    <iframe *ngIf="tipoModal === 'juego'"
            src="assets/galaga.html"
            style="width: 640px; height: 680px; border: none;">
    </iframe>
  </div>
</div>
